# Tool-Call Verifier eval Job against an llm-d (or any OpenAI-compatible)
# endpoint running in the cluster.
#
# Before applying, set:
#   - image: where you pushed the tcv image (see tcv/README.md)
#   - TCV_BASE_URL: your llm-d gateway/service URL, including /v1
#   - args: suites and flags for run_tcv_eval.py (run with --help for options)
#
# kubectl apply -f tcv-job.yaml
# kubectl logs -f job/tcv-eval
apiVersion: batch/v1
kind: Job
metadata:
  name: tcv-eval
  labels:
    app: tcv-eval
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: tcv-eval
    spec:
      restartPolicy: Never
      containers:
        - name: tcv
          image: registry.example.com/tcv:latest
          env:
            - name: TCV_BASE_URL
              # llm-d inference gateway service, e.g.
              # http://<gateway-svc>.<namespace>.svc.cluster.local:<port>/v1
              value: http://llm-d-inference-gateway.llm-d.svc.cluster.local:80/v1
            - name: TCV_API_KEY
              value: dummy
              # For a real key, use a secret instead:
              # valueFrom:
              #   secretKeyRef:
              #     name: tcv-api-key
              #     key: api-key
          args:
            # Model is auto-detected from /v1/models when omitted.
            - --profile
            - glm
            - --suites
            - behavior,tool_choice,schema
            # - --model
            # - your-model-id
            # - --thinking
            # - "off"
          resources:
            requests:
              cpu: "2"
              memory: 2Gi
            limits:
              memory: 4Gi
          volumeMounts:
            - name: results
              mountPath: /results
      volumes:
        - name: results
          emptyDir: {}
          # To keep results after the pod is gone, use a PVC instead:
          # persistentVolumeClaim:
          #   claimName: tcv-results
