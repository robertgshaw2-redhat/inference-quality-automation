[project]
name = "tcv"
version = "0.1.0"
description = "Tool-Call Verifier: model-agnostic tool-calling quality evals for OpenAI-compatible endpoints"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.1",
    "jsonschema>=4.25.1",
    "openai>=2.14.0",
    "pytest>=8.0",
    "pytest-rerunfailures>=14.0",
    "pytest-xdist>=3.5",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.setuptools]
packages = ["tcv"]
